# Needs metrics-server (not installed by default on Docker Desktop; see README "Kubernetes").
# Scales on CPU: one forward pass at a time per pod, so CPU saturates before memory grows.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: banking77-distilbert
  namespace: banking77
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: banking77-distilbert
  minReplicas: 1
  maxReplicas: 2          # 8 GB laptop / 4 GB Docker cap: 2 x 1.25 GiB limit at most
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}   # % of the 250m request
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
