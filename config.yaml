# Single config for the Banking77 fine-tuning vs prompting project.
# Paths are relative to the project root (the folder containing this file).
# Everything machine-specific (models, device) is a setting here, so the same code runs on the
# build laptop (CPU), the GPU laptop, or Colab.

paths:
  raw: data/raw
  processed: data/processed
  splits: data/splits
  cache: data/cache          # per-item JSONL caches for the LLM evaluations
  results: results
  models: models             # Colab outputs go here (GGUF, adapter, training_log.json)
  traces_db: data/traces.db

data:
  # Original PolyAI CSVs (same data as Hugging Face PolyAI/banking77, which is CC BY 4.0).
  source: github
  train_url: https://raw.githubusercontent.com/PolyAI-LDN/task-specific-datasets/master/banking_data/train.csv
  test_url: https://raw.githubusercontent.com/PolyAI-LDN/task-specific-datasets/master/banking_data/test.csv
  hf_card_url: https://huggingface.co/datasets/PolyAI/banking77/raw/main/README.md
  seed: 42
  val_frac: 0.10             # stratified hold-out from train, for tuning and early stopping
  subset_per_class: 10       # stratified test subset for the slow LLM systems (77 x 10 = 770)
  dev_subset_per_class: 2    # tiny stratified validation subset for prompt tuning (154)

baseline:
  # TF-IDF + logistic regression. C is chosen on the validation split only.
  C_grid: [1, 3, 10, 30, 100, 300, 1000]  # extended after 100 was the edge of the first grid
  ngram_range: [1, 2]
  sublinear_tf: true
  min_df: 1

llm:
  base_url: http://127.0.0.1:11434   # = localhost; avoids a ~2 s IPv6-first lookup per request on Windows
  temperature: 0
  seed: 42
  num_predict: 24            # a label is at most ~10 tokens
  num_ctx: 4096
  keep_alive: 30m
  request_timeout_s: 600
  # System keys used by the eval scripts and the app. Change the model names here on the demo laptop
  # (e.g. qwen2.5:3b instead of qwen2.5:7b on a 4 GB GPU).
  systems:
    zero_shot_7b:   {model: "qwen2.5:7b",   mode: zero_shot, label: "(b) Zero-shot qwen2.5:7b"}
    few_shot_7b:    {model: "qwen2.5:7b",   mode: few_shot,  label: "(c) Few-shot (kNN) qwen2.5:7b"}
    base_1p5b:      {model: "qwen2.5:1.5b", mode: zero_shot, label: "(d) Base Qwen2.5-1.5B-Instruct zero-shot"}
    zero_shot_3b:   {model: "qwen2.5:3b",   mode: zero_shot, label: "(b2) Zero-shot qwen2.5:3b"}   # CONVENTIONS: evaluate 7B and 3B
    finetuned_1p5b: {model: "banking77-qwen1.5b-lora", mode: finetuned, label: "(e) LoRA fine-tuned Qwen2.5-1.5B-Instruct"}
  few_shot:
    method: knn              # knn = nearest training examples by TF-IDF cosine; examples come from train only
    k: 10

finetune:
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  ollama_name: banking77-qwen1.5b-lora
  gguf_file: banking77-qwen1.5b-lora.Q4_K_M.gguf
  lora_r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  max_seq_len: 256
  epochs: 3
  lr: 2.0e-4
  batch_size: 16
  grad_accum: 1
  early_stopping_patience: 1  # evaluations (each half epoch) without val-loss improvement

classic:
  # Classic NLP baselines (added 2026-10, upgrade). Same protocol as (a): every hyperparameter is chosen on
  # the validation split only, the model is refit on train, and test / test_subset are scored once.
  # Outputs mirror (a): results/classic_<key>.json, results/predictions/<key>_<split>.csv, models/<key>.joblib.
  systems:
    nb_tfidf:        {label: "(f) TF-IDF + multinomial Naive Bayes", features: word, preprocess: none,  clf: nb}
    svm_tfidf:       {label: "(g) TF-IDF + linear SVM",              features: word, preprocess: none,  clf: svm}
    svm_char:        {label: "(h) Char n-gram TF-IDF + linear SVM",  features: char, preprocess: none,  clf: svm}
    spacy_lemma_svm: {label: "(i) spaCy lemmas + linear SVM",        features: word, preprocess: spacy, clf: svm}
  word_ngram_range: [1, 2]
  char_ngram_range: [2, 5]   # char_wb analyzer: n-grams inside word boundaries (robust to typos)
  sublinear_tf: true
  min_df: 1
  nb_alpha_grid: [0.01, 0.03, 0.1, 0.3, 1.0]
  svm_C_grid: [0.03, 0.1, 0.3, 1, 3, 10]
  # spaCy preprocessing for spacy_lemma_svm: lowercase lemmas, punctuation/space tokens dropped.
  # Stop-word removal on/off is itself chosen on validation (spacy_remove_stop_grid). Words in
  # spacy_keep_words are never removed: spaCy's stop list contains them, but they separate intents
  # (e.g. why_verify_identity vs verify_my_identity, card_not_working).
  spacy_model: en_core_web_sm
  spacy_remove_stop_grid: [true, false]
  spacy_keep_words: [not, no, never, why, how, when, where, what, which, can, cannot, nothing, again, still]
  latency_sample_n: 500      # per-request latency on the first N items, one message at a time (as for (a))

distilbert:
  # (j) DistilBERT fine-tuned with a hand-written PyTorch loop (no HF Trainer). Sized for a 4 GB GPU.
  system_key: distilbert_pt
  label: "(j) DistilBERT fine-tuned (PyTorch loop)"
  base_model: distilbert-base-uncased
  out_dir: models/distilbert          # best checkpoint (save_pretrained); gitignored via models/*
  max_len: 64                         # Banking77 messages are short; truncation count is logged
  batch_size: 32
  eval_batch_size: 128
  epochs: 8                           # upper bound; early stopping usually ends sooner
  lr: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1                   # linear warm-up over the first 10% of steps, then linear decay to 0
  max_grad_norm: 1.0
  early_stopping_patience: 2          # epochs without a validation-loss improvement
  min_delta: 0.0
  seed: 42
  amp: true                           # fp16 autocast + GradScaler, CUDA only (ignored on CPU)
  num_workers: 0                      # Windows-safe DataLoader
  latency_sample_n: 500               # CPU per-request latency sample; the main device times every item
  cpu_threads: 4                      # torch threads for the CPU latency measurement

cost:
  # ASSUMPTION, not a measurement: on-demand price of a small cloud instance used to turn measured
  # seconds into dollars. Edit to match the machine you quote.
  cpu_instance_usd_per_hour: 0.17   # e.g. an 8-vCPU general-purpose VM
  gpu_instance_usd_per_hour: 0.53   # e.g. a single NVIDIA T4 VM
